<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANS WIFI - Connect</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f6f8; 
            margin: 0; 
            padding: 20px;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 90vh;
        }
        .container { width: 100%; max-width: 350px; }
        .box { 
            background: white; 
            padding: 30px 22px; 
            border-radius: 16px; 
            border: 1px solid #e1e4e8; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.06); 
            text-align: center; 
            box-sizing: border-box;
        }
        h2 { margin: 0; color: #0052cc; font-size: 24px; }
        p { color: #5e6c84; font-size: 14px; margin-top: 6px; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 13px; color: #172b4d; display: block; margin-bottom: 8px; text-align: left; }
        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            font-size: 24px; 
            border: 2px solid #dfe1e6; 
            border-radius: 8px; 
            box-sizing: border-box; 
            margin-bottom: 18px; 
            text-align: center; 
            letter-spacing: 6px; 
            font-weight: bold; 
            color: #0052cc;
        }
        input[type="text"]:focus { border-color: #0052cc; outline: none; }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #0052cc; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: #0065ff; }
        .error { color: #de350b; background: #ffebe6; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: left; line-height: 1.4; }
        .mac-info { font-size: 11px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>HANS WIFI</h2>
            <p>Ingiza namba ya vocha kuunganisha intaneti</p>
            
            {% if error %}
                <div id="rate-limit-alert" class="error">
                    <span id="error-message-text">
                        {{ error }} {% if retry_after and retry_after > 0 %}(Subiri sekunde <span id="countdown-secs">{{ retry_after }}</span>){% endif %}
                    </span>
                </div>
            {% endif %}

            <!-- Voucher submission form -->
            <form action="/login" method="POST">
                <!-- Hidden inputs preserve Access Point parameters for session creation -->
                <input type="hidden" name="mac" value="{{ mac }}">
                <input type="hidden" name="gw_address" value="{{ gw_address }}">
                <input type="hidden" name="gw_port" value="{{ gw_port }}">
                <input type="hidden" name="gw_id" value="{{ gw_id }}">
                <input type="hidden" name="userurl" value="{{ userurl }}">
                
                <label for="voucher">Namba ya Vocha (Digits 5):</label>
                <input 
                    type="text" 
                    id="voucher" 
                    name="voucher" 
                    maxlength="5" 
                    pattern="\d{5}" 
                    placeholder="12345" 
                    inputmode="numeric"
                    required 
                    autofocus
                >
                <button type="submit" id="submit-btn">CONNECT INTERNET</button>
            </form>

            <div class="mac-info">Device MAC: {{ mac }}</div>
        </div>
    </div>

    {% if error and retry_after and retry_after > 0 %}
    <script>
        let timeLeft = {{ retry_after }};
        const errorMsgText = document.getElementById('error-message-text');
        const alertBox = document.getElementById('rate-limit-alert');
        const submitBtn = document.getElementById('submit-btn');
        const voucherInput = document.getElementById('voucher');

        // Disable elements initially while locked out
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.5';
            submitBtn.style.cursor = 'not-allowed';
            submitBtn.style.background = '#94a3b8';
        }
        if (voucherInput) {
            voucherInput.disabled = true;
        }

        if (timeLeft > 0) {
            const timer = setInterval(() => {
                timeLeft--;
                const secsSpan = document.getElementById('countdown-secs');
                if (secsSpan) secsSpan.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    
                    // Change error text to "Enter now"
                    if (errorMsgText) {
                        errorMsgText.innerHTML = "Muda wa kusubiri umekwisha. <strong>Enter now! (Jaribu tena)</strong>";
                    }
                    
                    // Turn box into a friendly green ready state
                    if (alertBox) {
                        alertBox.style.background = '#e3fcef';
                        alertBox.style.color = '#006644';
                        alertBox.style.border = '1px solid #abf5d1';
                    }
                    
                    // Re-enable submit button and input field
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.style.opacity = '1';
                        submitBtn.style.cursor = 'pointer';
                        submitBtn.style.background = '#0052cc';
                        submitBtn.innerText = 'ENTER NOW';
                    }
                    if (voucherInput) {
                        voucherInput.disabled = false;
                        voucherInput.focus();
                    }
                }
            }, 1000);
        }
    </script>
    {% endif %}

    <!-- Client-side input handling -->
    <script>
        // Enforce numeric-only input on the voucher field dynamically
        const voucherField = document.getElementById('voucher');
        if (voucherField) {
            voucherField.addEventListener('input', function (e) {
                this.value = this.value.replace(/[^0-9]/g, '');
            });
        }
    </script>
</body>
</html>
