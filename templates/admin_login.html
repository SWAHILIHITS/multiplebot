<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANS WIFI - Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            margin: 0; 
            padding: 20px;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 90vh;
        }
        .container { width: 100%; max-width: 380px; }
        .box { 
            background: #1e293b; 
            padding: 35px 25px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            text-align: center; 
            box-sizing: border-box;
            color: #f8fafc;
        }
        h2 { margin: 0; color: #fff; font-size: 24px; font-weight: 800; }
        h2 span { color: #3b82f6; }
        p { color: #94a3b8; font-size: 14px; margin-top: 6px; margin-bottom: 24px; }
        label { font-weight: 600; font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 8px; text-align: left; }
        
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input[type="password"], input[type="text"] { 
            width: 100%; 
            padding: 14px 45px 14px 16px; 
            font-size: 15px; 
            border: 1px solid #334155; 
            background: #0f172a;
            color: #fff;
            border-radius: 10px; 
            box-sizing: border-box; 
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            width: auto;
        }
        .toggle-password:hover { color: #cbd5e1; }

        button[type="submit"] { 
            width: 100%; 
            padding: 14px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
        }
        button[type="submit"]:hover { background: #2563eb; transform: translateY(-1px); }
        
        .error { 
            color: #fca5a5; 
            background: rgba(239, 68, 68, 0.1); 
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            margin-bottom: 20px; 
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-link { display: block; margin-top: 20px; font-size: 13px; color: #94a3b8; text-decoration: none; }
        .back-link:hover { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>HANS<span>WIFI</span></h2>
            <p>Ingia kwenye Dashibodi ya Msimamizi</p>
            
            {% if error %}
                <div id="rate-limit-alert" class="error">
                    <i class="fa-solid fa-triangle-exclamation" style="flex-shrink: 0;"></i>
                    <span id="error-message-text">
                        {{ error }} {% if retry_after %}(Subiri sekunde <span id="countdown-secs">{{ retry_after }}</span>){% endif %}
                    </span>
                </div>
            {% endif %}

            <form action="/admin/login" method="POST">
                <label for="password">Nenosiri la Admin:</label>
                <div class="input-group">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Weka nenosiri..." 
                        required 
                        autofocus
                    >
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                        <i id="toggle-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <button type="submit" id="submit-btn">INGIA ADMIN</button>
            </form>

            <a href="/portal" class="back-link"><i class="fa-solid fa-arrow-left"></i> Rudi kwenye Ukurasa wa Kuunganisha</a>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('toggle-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Rate Limit Countdown Timer (if retry_after is provided by Flask-Limiter)
        let timeLeft = {{ retry_after | default(0) }};
        if (timeLeft > 0) {
            const alertBox = document.getElementById('rate-limit-alert');
            const submitBtn = document.getElementById('submit-btn');
            
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.5';
            submitBtn.style.cursor = 'not-allowed';

            const timer = setInterval(() => {
                timeLeft--;
                const secsSpan = document.getElementById('countdown-secs');
                if (secsSpan) secsSpan.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (alertBox) alertBox.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                }
            }, 1000);
        }
    </script>
</body>
</html>
