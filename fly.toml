# fly.toml app configuration file generated for multiplebot on 2026-05-26T09:02:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'multiplebot'
primary_region = 'ams'

[build]

[build.settings]
  pythonbase = "3.11-slim"
[processes]
  web = "gunicorn -b 0.0.0.0:8080 app:app"
  bot = "python3 bot.py"

[[restart]]
  policy = "on-failure"
  retries = 1
  processes = ["app"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  size = 'shared-cpu-1x'

# --- ROUTING FOR WEB APP ---
[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["web"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/"
